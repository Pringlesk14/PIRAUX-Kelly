<title>PULSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : une colonne mobile (max 440px) sur fond cosmique, barre basse à 5 entrées avec micro PULSE central. */
:root{
  --bg:#10071F; --surface:#1B1030; --surface2:#251744; --primary:#873BFF; --electric:#A855F7;
  --accent:#FF4FD8; --blue:#4F7BFF; --cyan:#22D3EE; --text:#FFFFFF; --text2:#C9C1D6;
  --muted:#8E83A6; --line:rgba(201,193,214,.14); --live:#FF4F7B; --ok:#34D399; --warn:#FFC93C;
  --f-display:'Unbounded','Space Grotesk',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-card:22px; --r-pill:999px;
  color-scheme:dark;
}
/* Piste Ocean Signal : proposition modernisée, codes non validés par Kelly */
:root[data-skin="ocean"]{
  --bg:#04161D; --surface:#0A2630; --surface2:#0F3441; --primary:#0FA3A3; --electric:#2FE0D6;
  --accent:#FFC93C; --blue:#1E88B8; --cyan:#7DF9FF; --text2:#B5D2D8; --muted:#7FA2AA;
  --line:rgba(181,210,216,.14); --live:#FF6B5B;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(60% 40% at 85% 0%, color-mix(in srgb,var(--primary) 38%,transparent), transparent 70%),
   radial-gradient(50% 35% at 0% 30%, color-mix(in srgb,var(--blue) 22%,transparent), transparent 70%),
   radial-gradient(45% 30% at 100% 85%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 70%);}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:10px}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100%}
.scr{padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.scr.no-nav{padding-bottom:40px}
body.has-room .scr:not(.no-nav){padding-bottom:200px}
.scr.in-room{padding-bottom:190px}
:root[data-skin="ocean"] .cat,:root[data-skin="ocean"] .room-card .cover{filter:hue-rotate(-75deg) saturate(.9)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:17px}
h3{font-size:14px}
p{margin:0}
.muted{color:var(--text2)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{color:var(--electric);font-weight:700;font-size:13px}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;letter-spacing:.06em}
.logo svg{height:1em;width:auto}
.logo .wm{background:linear-gradient(90deg,#fff,var(--text2) 40%,var(--electric) 75%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:var(--r-pill);font-weight:800;font-size:15px;transition:transform .15s, filter .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(100deg,var(--primary),var(--electric) 55%,var(--accent));color:#fff;box-shadow:0 8px 28px -8px color-mix(in srgb,var(--electric) 70%,transparent)}
.btn-g{background:color-mix(in srgb,var(--surface2) 80%,transparent);border:1px solid var(--line)}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--surface2) 70%,transparent);border:1px solid var(--line);position:relative}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* Puces */
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-pill);font-size:13px;font-weight:700;background:color-mix(in srgb,var(--surface2) 70%,transparent);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--primary) 35%,transparent);border-color:var(--electric);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.tag{white-space:nowrap;font-size:11px;font-weight:800;padding:3px 8px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);color:var(--text2);letter-spacing:.04em}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:color-mix(in srgb,var(--live) 85%,transparent);padding:4px 9px;border-radius:var(--r-pill)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
.plus{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--warn),var(--accent));color:#1a0b2e}
@keyframes blink{50%{opacity:.3}}

/* Cartes */
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--surface2) 90%,transparent),color-mix(in srgb,var(--surface) 92%,transparent));border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;border:1px solid color-mix(in srgb,var(--electric) 40%,transparent);
  background:radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--accent) 45%,transparent), transparent 55%),linear-gradient(150deg,color-mix(in srgb,var(--primary) 70%,var(--bg)),var(--surface) 70%)}
.hero .planet{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0, color-mix(in srgb,var(--accent) 70%,#fff) 8%, var(--electric) 35%, var(--primary) 65%, transparent 72%);
  box-shadow:0 0 60px 10px color-mix(in srgb,var(--electric) 45%,transparent);opacity:.85}
.hero .ring{position:absolute;right:-60px;top:40px;width:230px;height:46px;border-radius:50%;border:2px solid color-mix(in srgb,var(--cyan) 55%,transparent);transform:rotate(-18deg)}
.hero>*:not(.planet):not(.ring){position:relative}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.room-card{display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0}
.room-card .cover{height:92px;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px}
.room-card .cover .ico{position:absolute;right:12px;top:12px;width:44px;height:44px;opacity:.9;stroke-width:1.5}
.faces{display:flex}
.faces>*{margin-left:-8px;border-radius:50%;border:2px solid var(--surface);background:var(--surface)}
.faces>*:first-child{margin-left:0}
.count{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;text-align:left;width:100%;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);min-width:0}
.list-item .grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{aspect-ratio:1/1;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-align:left;position:relative;overflow:hidden;font-weight:800;font-size:12.5px;line-height:1.2;max-width:100%}
.cat .ico{width:30px;height:30px;stroke-width:1.7}
.cat::after{content:"";position:absolute;inset:auto -20% -40% auto;width:80%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12)}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:var(--muted)}
.demo-note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--text2);padding:10px 12px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent)}
.demo-note b{color:var(--warn)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border-radius:var(--r-pill);font-weight:800;font-size:13px;color:var(--text2)}
.tabs button.on{background:linear-gradient(100deg,var(--primary),var(--electric));color:#fff}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:flex;align-items:center;gap:6px;font-weight:800}

/* Navigation basse */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);z-index:20;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:70px;border-radius:26px;padding:0 6px 8px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 -10px 40px -10px rgba(0,0,0,.6)}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding-top:8px}
.nav-b.on{color:#fff}
.nav-b.on .ico{stroke:var(--electric);filter:drop-shadow(0 0 6px var(--electric))}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;letter-spacing:.08em}
.mic{position:relative;width:68px;height:68px;border-radius:50%;margin-top:-34px;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,#fff 35%,var(--accent)), var(--electric) 45%, var(--primary) 80%);
  box-shadow:0 0 0 5px var(--bg),0 0 28px 4px color-mix(in srgb,var(--electric) 70%,transparent)}
.mic .ico{width:30px;height:30px;stroke-width:2.1}
.mic::before,.mic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 70%,transparent);opacity:0;animation:ring 2.6s infinite}
.mic::after{animation-delay:1.3s}
.mic.hot{background:radial-gradient(circle at 35% 30%, #fff, var(--accent) 40%, var(--live) 90%)}
.mic.hot::before,.mic.hot::after{animation-duration:1.1s;border-color:var(--accent)}
.mic.off{background:radial-gradient(circle at 35% 30%, #5d5376, #2c2244 80%);box-shadow:0 0 0 5px var(--bg)}
.mic.off::before,.mic.off::after{display:none}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.55);opacity:0}}
.mini-room{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),416px);z-index:19;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:18px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--primary) 60%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--electric) 50%,transparent);text-align:left}

/* Salon vocal */
.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;justify-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;text-align:center;min-width:0;max-width:100%}
.seat .av{position:relative;border-radius:50%}
.seat .av.speaking{box-shadow:0 0 0 3px var(--accent),0 0 22px 4px color-mix(in srgb,var(--accent) 60%,transparent);animation:talk 1s ease-in-out infinite}
@keyframes talk{50%{box-shadow:0 0 0 4px var(--electric),0 0 30px 8px color-mix(in srgb,var(--electric) 55%,transparent)}}
.seat .badge{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.seat .badge .ico{width:14px;height:14px}
.role{font-size:10.5px;color:var(--text2);font-weight:700}
.room-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);z-index:20;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.room-bar .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:8px 12px 10px;border-radius:26px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
.mic-state{text-align:center;font-size:12px;font-weight:700;margin-top:6px;max-width:150px}
.reacts{display:flex;gap:4px}
.reacts button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.06);font-size:18px}
.floaty{position:fixed;z-index:30;font-size:28px;pointer-events:none;animation:floatUp 1.6s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-180px) scale(1.3);opacity:0}}
.wave{display:flex;gap:3px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:var(--accent);animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:18px}}

/* Feuilles (bottom sheets) */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,2,12,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,440px);max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;text-align:left;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .ic-b{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));flex:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;max-width:min(92%,400px);padding:12px 16px;border-radius:16px;background:var(--surface2);border:1px solid color-mix(in srgb,var(--electric) 50%,transparent);font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s ease-out}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--text2)}
.inp{height:50px;padding:0 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);outline:0;font-size:15px;width:100%}
textarea.inp{height:auto;min-height:90px;padding:12px 16px;resize:vertical}
.inp:focus{border-color:var(--electric)}
.err{color:var(--live);font-size:13px;font-weight:700}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--primary),var(--accent))}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:linear-gradient(90deg,var(--primary),var(--accent))}
.toggle.on::after{transform:translateX(20px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.set-row:last-child{border-bottom:0}

/* Avatar éditeur */
.av-stage{display:grid;place-items:center;padding:8px 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw.on{border-color:#fff;box-shadow:0 0 12px var(--electric)}
.pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:20px;background:rgba(255,255,255,.04);border:1.5px solid var(--line);text-align:center;position:relative;min-width:0}
.pick.on{border-color:var(--electric);background:color-mix(in srgb,var(--primary) 22%,transparent);box-shadow:0 0 18px -4px var(--electric)}
.pick .nm{font-weight:800;font-size:13.5px}
.pick .ds{font-size:11.5px;color:var(--text2)}
.pick .plus{position:absolute;top:8px;right:8px}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acc-grid .pick{padding:10px 6px}
.acc-grid svg{width:100%;max-width:84px;height:auto;aspect-ratio:1}

/* Chat */
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 14px;border-radius:20px;font-size:14.5px;overflow-wrap:anywhere}
.bub.them{background:var(--surface2);border-bottom-left-radius:6px;align-self:flex-start}
.bub.me{background:linear-gradient(110deg,var(--primary),var(--electric));border-bottom-right-radius:6px;align-self:flex-end}
.bub .tr{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:13px;color:var(--text2)}
.voice{display:flex;align-items:center;gap:10px}
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);z-index:20;display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;height:46px;border-radius:var(--r-pill);padding:0 16px;background:var(--surface);border:1px solid var(--line);outline:0}

/* Accueil bienvenue */
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding-block:40px 36px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));gap:28px;text-align:center}
.big-mic{position:relative;width:180px;height:180px;margin:0 auto;display:grid;place-items:center}
.big-mic .core{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,#fff 40%,var(--accent)), var(--electric) 45%, var(--primary) 85%);
  box-shadow:0 0 50px 8px color-mix(in srgb,var(--electric) 65%,transparent), inset 0 0 20px rgba(255,255,255,.3)}
.big-mic .core .ico{width:52px;height:52px;stroke-width:1.8}
.big-mic span{position:absolute;inset:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--cyan) 60%,transparent);animation:ring 3s infinite}
.big-mic span:nth-child(2){animation-delay:1s;border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.big-mic span:nth-child(3){animation-delay:2s}
.status-list li{margin-bottom:6px}
.pill-status{font-size:11px;font-weight:800;padding:3px 8px;border-radius:var(--r-pill)}
.st-ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}

 return `<div class="scr">${topBar('Communauté')}

 ${tab==='acts'?(as.map(actCard).join('')||'<p class="muted">Pas encore d’activité dans cette communauté.</p>'):''}

 ${nav('')}</div>`},

/* ----- Salon vocal ----- */
room:(id)=>{const r=room(id),c=com(r.com),inR=R&&R.id===id;
 const seat=(pid,role,speaking)=>{const p=person(pid);const isMe=pid==='me';const muted=isMe?R.muted:!speaking;
  return `<div class="seat"><div class="av ${speaking?'speaking':''}">${avatar(p.av,role==='Hôte'?84:70)}<span class="badge">${ic(muted?'micoff':'mic')}</span></div><span class="ellip" style="max-width:90px">${esc(isMe?'Toi':p.name)}</span><span class="role">${role}</span></div>`};
 const sp=[...r.speakers];
 const meSpeaker=inR&&R.role!=='listener';
 if(!r.live&&!inR) return `<div class="scr">${topBar(esc(c.name))}<div class="hero"><div class="planet"></div><span class="tag" style="align-self:flex-start">${esc(r.when)}</span><h1>${esc(r.title)}</h1><p class="muted">Hôte : ${esc(person(r.host).name)} · ${r.langs.join(' / ')}</p></div>
  <p class="muted">Ce salon n’a pas encore commencé.</p><button class="btn btn-p" data-a="remind-room" data-v="${r.id}">${ic('bell')} Me prévenir au début</button>${demo('<b>Prototype :</b> le rappel est noté sur cet appareil, sans notification réelle.')}${nav('')}</div>`;
 return `<div class="scr in-room">
 <div class="top"><button class="back" data-a="back" aria-label="Retour">${ic('back')}<span>${esc(c.name)}</span></button><div class="row"><button class="icon-btn" data-a="invite" data-v="${r.id}" aria-label="Inviter">${ic('userplus')}</button><button class="icon-btn" data-a="room-menu" data-v="${r.id}" aria-label="Plus d’options">${ic('dots')}</button></div></div>
 <div class="stack" style="gap:8px"><div class="row wrap"><span class="live">${t('live')}</span>${r.langs.map(l=>`<span class="tag">${l}</span>`).join('')}${r.private?`<span class="tag">${ic('lock')} Privé</span>`:''}</div><h1>${esc(r.title)}</h1>
  <span class="count">${fmt(r.listeners+sp.length+1+(inR?1:0))} personnes · ${fmt(sp.length+1+(meSpeaker?1:0))} au micro</span></div>
 ${demo('<b>Audio non branché :</b> ce salon est une démonstration visuelle. Aucun son n’est capté ni diffusé.')}
 ${r.act?`<button class="card row" data-a="open-act" data-v="${r.act}" style="text-align:left;border-color:color-mix(in srgb,var(--accent) 50%,transparent)"><div style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent))">${ic('sparkle')}</div><div style="flex:1;min-width:0"><div class="eyebrow">Activité en cours</div><div style="font-weight:800">${esc(ACTS.find(a=>a.id===r.act).title)}</div></div><span class="link">Ouvrir</span></button>`:''}
 <section class="stack"><h2>Sur scène</h2><div class="stage">${r.host==='me'?seat('me','Hôte',inR&&!R.muted):seat(r.host,'Hôte',true)}${sp.map((s,i)=>seat(s,'Intervenant·e',i===0&&!(inR&&!R.muted))).join('')}${meSpeaker&&r.host!=='me'?seat('me','Intervenant·e',!R.muted):''}</div></section>
 <section class="stack"><h2>À l’écoute</h2><div class="row wrap" style="gap:8px">${(inR&&R.role==='listener'?`<div class="seat">${avatar(S.av,48)}<span>Toi</span></div>`:'')}${Object.keys(PEOPLE).filter(p=>p!==r.host&&!sp.includes(p)).slice(0,5).map(p=>`<div class="seat">${avatar(PEOPLE[p].av,48)}<span>${esc(PEOPLE[p].name)}</span></div>`).join('')}${r.listeners>5?`<div class="seat"><div style="width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:800;font-size:12px">+${fmt(r.listeners-5)}</div><span>autres</span></div>`:''}</div></section>
 ${inR&&R.hand&&R.role==='listener'?`<p class="small" style="color:var(--warn);font-weight:700">Main levée : en attente de l’hôte.</p>`:''}
 </div>
 <div class="room-bar"><div class="in">
  <div class="reacts">${['❤️','🔥','👏','😂'].map(e=>`<button data-a="react" data-v="${e}" aria-label="Réagir ${e}">${e}</button>`).join('')}</div>
  <div class="mic-wrap">${roomMic(r)}</div>
  <div class="row" style="justify-content:flex-end">${inR?`<button class="btn btn-g btn-sm" data-a="leave">${t('leave')}</button>`:`<button class="btn btn-p btn-sm" data-a="enter" data-v="${r.id}">${t('join')}</button>`}</div>
 </div></div>`;
},

  <section class="stack"><h2>${t('people')}</h2><p class="small muted">Selon vos passions communes. PULSE n’est pas une appli de rencontres amoureuses : on se rencontre par ce qu’on aime.</p>${Object.keys(PEOPLE).filter(p=>!S.blocked.includes(p)).sort((a,b)=>PEOPLE[b].int.filter(i=>S.interests.includes(i)).length-PEOPLE[a].int.filter(i=>S.interests.includes(i)).length).slice(0,5).map(personRow).join('')}</section></div>`;
 }

 const ps=Object.keys(PEOPLE).filter(p=>!S.blocked.includes(p)&&(!UI.discLang||PEOPLE[p].langs.includes(UI.discLang))&&(!q||PEOPLE[p].name.toLowerCase().includes(q)||PEOPLE[p].int.some(i=>cat(i).name.toLowerCase().includes(q))));

 sheet(`<div class="row">${logo(20)}</div><h2>Que veux-tu faire ?</h2>

function actSheet(id){
 const a=ACTS.find(x=>x.id===id);
 if(a.status==='done'){sheet(`<h2>${esc(a.title)}</h2><p class="muted">${esc(a.desc)}</p><button class="btn btn-g" data-a="close">Fermer</button>`);return}
 if(a.status==='soon'){sheet(`<span class="tag" style="align-self:flex-start">${esc(a.when)}</span><h2>${esc(a.title)}</h2><p class="muted">${esc(a.desc)}</p><h3>Règles</h3><ul class="muted" style="margin:0;padding-left:18px">${a.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><button class="btn btn-p" data-a="remind" data-v="${a.id}">${ic('bell')} Me rappeler</button>`);return}
 if(QUIZ[id]){quiz(id,0,0);return}
 // Audition à l'aveugle
 const judges=['lea','marco','sam'];
 sheet(`<div class="row between"><span class="live">${t('live')}</span><span class="tag">Audition à l’aveugle</span></div><h2>${esc(a.title)}</h2>
 <div class="card stack" style="align-items:center;text-align:center"><div style="filter:blur(7px)">${avatar(PEOPLE.nora.av,90)}</div><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p><b>Candidat·e mystère</b> chante une composition originale</p></div>
 <h3>Les jurés</h3><div class="stage" id="judges">${judges.map(j=>`<div class="seat" data-j="${j}"><div class="av" style="transform:scaleX(-1);opacity:.55">${avatar(PEOPLE[j].av,60)}</div><span>${PEOPLE[j].name}</span><span class="role">dos tourné</span></div>`).join('')}</div>
 <button class="btn btn-p" data-a="turn" id="turn-btn">${ic('sparkle')} Je me retourne</button>
 <p class="small muted">Démo : les autres jurés réagissent automatiquement. Aucun son n’est diffusé.</p>
 <details class="muted small"><summary>Règles</summary><ul style="padding-left:18px">${a.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>`);
 judges.forEach((j,i)=>{if(i===1)return;setTimeout(()=>{const el=layer.querySelector(`[data-j="${j}"]`);if(el){el.querySelector('.av').style.cssText='opacity:1';el.querySelector('.av').classList.add('speaking');el.querySelector('.role').textContent='s’est retourné·e'}},1800+i*1700)});

function quiz(id,i,score){

 },

 'av-aura':v=>{S.av.aura=+v;save();render()},
 'av-lvl':v=>{S.av.auraLvl=+v;save();render()},
 'av-acc':v=>{const x=ACC.find(a=>a.id===v);S.av.acc={...S.av.acc};if(S.av.acc[x.slot]===v)delete S.av.acc[x.slot];else S.av.acc[x.slot]=v;save();render()},
 'open-room':v=>go('room',v),
 'open-com':v=>{UI.comTab='about';go('com',v)},
 'com-tab':v=>{UI.comTab=v;render()},
 'act-tab':v=>{UI.actTab=v;render()},
 'open-act':v=>{const a=ACTS.find(x=>x.id===v);if(a.status==='live'&&a.room&&!(R&&R.id===a.room)){R={id:a.room,role:'listener',muted:true,hand:false};if(V.name!=='room'||V.p!==a.room)go('room',a.room);else render()}actSheet(v)},
 join:v=>{const j=S.joined.includes(v);S.joined=j?S.joined.filter(x=>x!==v):[...S.joined,v];save();render();toast(j?'Tu as quitté la communauté.':'Bienvenue dans la communauté !')},
 enter:v=>{const r=room(v);R={id:v,role:r.host==='me'?'host':'listener',muted:true,hand:false};render();toast(r.host==='me'?'Ton salon est ouvert. Ton micro est coupé.':'Tu écoutes. Ton micro est coupé.')},
 leave:()=>{R=null;toast('Tu as quitté le salon.');back()},
 'room-mic':()=>{
  if(R.role==='listener'){
   if(R.hand){R.hand=false;render();toast('Main baissée.');return}
   R.hand=true;render();toast('Main levée. L’hôte peut t’inviter à parler.');
   const rid=R.id;setTimeout(()=>{if(R&&R.id===rid&&R.hand){R.role='speaker';R.hand=false;if(V.name==='room')render();toast(`${person(room(rid).host).name} t’invite à parler (simulation). Ton micro reste coupé.`)}},2600);return;
  }
  if(!S.micOk){sheet(`<div class="big-mic" style="width:120px;height:120px"><span></span><div class="core" style="width:84px;height:84px">${ic('mic')}</div></div><h2>Autoriser le micro</h2><p class="muted">PULSE utilise ton micro uniquement quand tu l’ouvres dans un salon. Les personnes présentes dans le salon t’entendent ; personne d’autre.</p>${demo('<b>Prototype :</b> aucune autorisation réelle n’est demandée et rien n’est enregistré.')}<button class="btn btn-p" data-a="mic-ok">Autoriser (simulation)</button><button class="btn btn-g" data-a="close">Pas maintenant</button>`);return}
  R.muted=!R.muted;render();
 },
 'mic-ok':()=>{S.micOk=1;save();closeSheet();R.muted=false;render();toast('Micro ouvert (simulation).')},
 react:(v,el)=>{const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='floaty';f.textContent=v;f.style.left=r.left+'px';f.style.top=(r.top-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1700)},
 invite:v=>sheet(`<h2>Inviter dans le salon</h2>${S.friends.length?S.friends.map(f=>`<button class="opt" data-a="invited" data-v="${f}">${avatar(PEOPLE[f].av,40)}<span><b>${esc(PEOPLE[f].name)}</b></span></button>`).join(''):'<p class="muted">Ajoute des amis depuis Découvrir pour les inviter.</p>'}<div class="card small muted" style="overflow-wrap:anywhere">Lien de partage (exemple) : pulse.app/s/${esc(v)}</div>`),
 invited:v=>{closeSheet();toast(`Invitation préparée pour ${PEOPLE[v].name} (démo, non envoyée).`)},
 'room-menu':v=>{const r=room(v);sheet(`<h2>${esc(r.title)}</h2><button class="opt" data-a="report" data-v="salon"><span class="ic-b">${ic('flag')}</span><span><b>Signaler le salon</b></span></button><button class="opt" data-a="rules"><span class="ic-b">${ic('shield')}</span><span><b>Règles et modération</b><br><span class="small muted">L’hôte peut couper un micro, retirer de la scène ou exclure.</span></span></button>${R&&R.id===v?`<button class="opt" data-a="leave"><span class="ic-b">${ic('logout')}</span><span><b>${t('leave')}</b></span></button>`:''}`)},
 report:v=>sheet(`<h2>Signaler</h2><p class="muted">Pourquoi ? Ton signalement reste confidentiel.</p>${['Harcèlement ou insultes','Contenu choquant ou dangereux','Usurpation d’identité','Personne mineure','Arnaque ou fraude','Autre'].map(x=>`<button class="opt" data-a="reported">${esc(x)}</button>`).join('')}`),
 reported:()=>{closeSheet();toast('Merci. Signalement noté (prototype : pas encore transmis à une équipe).')},
 rules:()=>sheet(`<h2>Règles de la communauté</h2><ul class="muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>PULSE est réservé aux 18 ans et plus.</li><li>Respect, consentement et bienveillance envers chaque voix.</li><li>Pas de harcèlement, d’insultes, de discours haineux, de fraude ni d’usurpation.</li><li>On n’enregistre personne sans son accord.</li><li>Les hôtes organisent la parole ; ils peuvent couper un micro ou exclure.</li><li>Signale ce qui te met mal à l’aise : tu peux aussi bloquer ou masquer quelqu’un.</li></ul><button class="btn btn-g" data-a="close">Compris</button>`),
 remind:v=>{const on=S.reminders.includes(v);S.reminders=on?S.reminders.filter(x=>x!==v):[...S.reminders,v];save();closeSheet();render();toast(on?'Rappel retiré.':'Rappel noté sur cet appareil.')},
 'remind-room':()=>toast('Rappel noté sur cet appareil.'),
 ans:v=>{const [id,i,sc,k]=v.split(':');const q=QUIZ[id][+i];const ok=+k===q.a;toast(ok?'Bonne réponse !':`Raté : c’était « ${q.o[q.a]} »`);quiz(id,+i+1,+sc+(ok?1:0))},
 turn:()=>{const el=layer.querySelector('[data-j="marco"]');if(el){el.querySelector('.av').style.cssText='opacity:1';el.querySelector('.av').classList.add('speaking');el.querySelector('.role').textContent='s’est retourné·e'}const b=document.getElementById('turn-btn');b.disabled=true;b.innerHTML=ic('check')+' Tu t’es retourné·e';toast('Tu t’es retourné·e pour cette voix !')},
 'disc-live':()=>{UI.discLive=!UI.discLive;render()},
 'disc-lang':v=>{UI.discLang=UI.discLang===v?'':v;render()},
 add:v=>{S.requested.push(v);save();render();toast(`Demande envoyée à ${PEOPLE[v].name} (démo). Elle s’accepte dans 2 s.`);setTimeout(()=>{S.requested=S.requested.filter(x=>x!==v);if(!S.friends.includes(v))S.friends.push(v);save();if(['discover','com','profile'].includes(V.name))render();toast(`${PEOPLE[v].name} a accepté (simulation).`)},2000)},
 chat:v=>go('chat',v),
 'chat-new':v=>{if(!S.convos.find(c=>c.id===v)){S.convos.unshift({id:v,msgs:[{f:'them',x:'Salut ! Ravi·e de te rencontrer sur PULSE.'}]});save()}go('chat',v)},
 tr:v=>{const [id,i]=v.split(':');S.convos.find(c=>c.id===id).msgs[+i].showTr=1;save();render()},
 'voice-note':v=>{S.convos.find(c=>c.id===v).msgs.push({f:'me',voice:'0:07',demo:1});save();render();window.scrollTo(0,document.body.scrollHeight);toast('Note vocale de démo ajoutée (aucun son enregistré).')},
 'user-menu':v=>sheet(`<h2>${esc(person(v).name)}</h2><button class="opt" data-a="report" data-v="${v}"><span class="ic-b">${ic('flag')}</span><b>Signaler</b></button><button class="opt" data-a="block" data-v="${v}"><span class="ic-b">${ic('x')}</span><span><b>Bloquer</b><br><span class="small muted">Cette personne ne pourra plus te contacter ni t’inviter.</span></span></button>`),
 block:v=>{S.blocked.push(v);S.friends=S.friends.filter(x=>x!==v);save();closeSheet();toast(`${person(v).name} est bloqué·e.`);HIST=[];V={name:'messages'};render(true)},
 unblock:v=>{S.blocked=S.blocked.filter(x=>x!==v);save();render()},
 skin:v=>{S.skin=v;save();render()},
 calm:()=>{S.calm=S.calm?0:1;save();render()},
 'show-age':()=>{S.me.showAge=S.me.showAge?0:1;save();render()},
 'n-rooms':()=>{S.notif.rooms^=1;save();render()},'n-msgs':()=>{S.notif.msgs^=1;save();render()},'n-acts':()=>{S.notif.acts^=1;save();render()},
 'edit-profile':()=>sheet(`<h2>Modifier le profil</h2><div class="field"><label for="p-bio">Bio</label><textarea class="inp" id="p-bio" maxlength="160" placeholder="Ce qui te fait vibrer…">${esc(S.me.bio)}</textarea></div><div class="field"><label>Langues parlées</label><div class="row wrap">${LANGS.map(([c])=>{const C=c.toUpperCase();return `<button class="chip ${S.me.langs.includes(C)?'on':''}" data-a="p-lang" data-v="${C}">${C}</button>`}).join('')}</div></div><button class="btn btn-p" data-a="p-save">Enregistrer</button>`),
 'p-lang':(v,el)=>{const L=S.me.langs;if(L.includes(v)&&L.length===1)return;S.me.langs=L.includes(v)?L.filter(x=>x!==v):[...L,v];el.classList.toggle('on');save()},
 'p-save':()=>{S.me.bio=document.getElementById('p-bio').value.trim();save();closeSheet();render()},
 'c-vis':v=>{document.getElementById('vis-pub').classList.toggle('on',v==='pub');document.getElementById('vis-priv').classList.toggle('on',v==='priv')},
 'c-submit':()=>{const ti=document.getElementById('c-title').value.trim();if(ti.length<3){document.getElementById('c-err').textContent='Donne un nom d’au moins 3 caractères à ton salon.';return}
  const r={id:'u'+Date.now(),com:document.getElementById('c-com').value,title:ti,langs:[document.getElementById('c-lang').value],live:1,host:'me',speakers:[],listeners:0,private:document.getElementById('vis-priv').classList.contains('on')};
  S.created.unshift(r);save();R={id:r.id,role:'host',muted:true,hand:false};V=HIST.pop()||{name:'home'};go('room',r.id);toast('Salon ouvert. Ton micro est coupé.')},
 reset:()=>sheet(`<h2>Tout effacer ?</h2><p class="muted">Ton profil, ton avatar et tes salons de démonstration seront supprimés de cet appareil.</p><button class="btn btn-p" data-a="reset-ok" style="background:var(--live)">Effacer et se déconnecter</button><button class="btn btn-g" data-a="close">Annuler</button>`),
 'reset-ok':()=>{try{localStorage.removeItem(KEY)}catch(e){}S=DEF();R=null;HIST=[];V={name:'welcome'};closeSheet();render(true)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el,e)}});
document.addEventListener('input',e=>{
 if(e.target.id==='disc-q'){UI.disc=e.target.value;document.getElementById('disc-res').innerHTML=discResults()}
 if(e.target.id==='msg-q'){UI.msgQ=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('msg-q');i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='ui-lang'||e.target.id==='ui-lang2'){S.ui=e.target.value;save();render()}
 if(e.target.id==='dm'){S.me.dm=e.target.value;save()}
});
document.addEventListener('submit',e=>{if(e.target.id!=='composer')return;e.preventDefault();const i=document.getElementById('msg-in');const x=i.value.trim();if(!x)return;S.convos.find(c=>c.id===V.p).msgs.push({f:'me',x});save();render();window.scrollTo(0,document.body.scrollHeight);document.getElementById('msg-in').focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- Étoiles ---------- */
(function(){const c=document.getElementById('stars'),x=c.getContext('2d');function draw(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.scale(d,d);let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<Math.round(innerWidth*innerHeight/2600);i++){x.globalAlpha=.25+rnd()*.6;x.fillStyle=rnd()>.85?'#E9D5FF':'#fff';x.beginPath();x.arc(rnd()*innerWidth,rnd()*innerHeight,rnd()*1.2+.2,0,7);x.fill()}}draw();addEventListener('resize',draw)})();

render(true);
})();
</script>
