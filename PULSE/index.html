<title>PULSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : colonne mobile (max 440px) façon « Vitrine néon » — fond cosmique violet, cartes à liseré lumineux, barre basse avec bouton PULSE central. */
:root{
  --bg:#0A0520; --surface:#150C30; --surface2:#1F1245; --primary:#7C3AED; --electric:#A855F7;
  --accent:#FF4FD8; --blue:#4F7BFF; --cyan:#38BDF8; --text:#FFFFFF; --text2:#C9C1D6;
  --muted:#9187AE; --line:rgba(168,85,247,.22); --line2:rgba(201,193,214,.12); --live:#FF4F7B; --ok:#34D399; --warn:#FFC93C;
  --f-brand:'Exo 2','Plus Jakarta Sans',system-ui,sans-serif;
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-card:22px; --r-pill:999px;
  color-scheme:dark;
}
/* Piste Ocean Signal : proposition, codes à valider */
:root[data-skin="ocean"]{
  --bg:#04161D; --surface:#0A2630; --surface2:#0F3441; --primary:#0E9F9A; --electric:#2FE0D6;
  --accent:#FFC93C; --blue:#1E88B8; --cyan:#7DF9FF; --text2:#B5D2D8; --muted:#7FA2AA;
  --line:rgba(47,224,214,.22); --line2:rgba(181,210,216,.12); --live:#FF6B5B;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(70% 45% at 90% -5%, color-mix(in srgb,var(--primary) 45%,transparent), transparent 70%),
   radial-gradient(55% 35% at -10% 35%, color-mix(in srgb,var(--blue) 22%,transparent), transparent 70%),
   radial-gradient(50% 30% at 110% 80%, color-mix(in srgb,var(--electric) 22%,transparent), transparent 70%);}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.75}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:10px}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100%}
.scr{padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.scr.no-nav{padding-bottom:40px}
body.has-room .scr:not(.no-nav){padding-bottom:200px}
.scr.in-room{padding-bottom:200px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--text2)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{color:var(--electric);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:.35em;font-family:var(--f-brand);font-style:italic;font-weight:800;letter-spacing:.1em;line-height:1}
.logo svg{height:1.15em;width:auto;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--electric) 70%,transparent))}
.logo .wm{color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--electric) 55%,transparent)}
.app-icon{width:132px;height:132px;border-radius:34px;display:grid;place-items:center;align-content:center;gap:6px;margin:0 auto;
  background:radial-gradient(circle at 50% 35%,#2B1466,#0D0626 75%);border:1.5px solid color-mix(in srgb,var(--electric) 60%,transparent);
  box-shadow:0 0 50px -6px color-mix(in srgb,var(--electric) 80%,transparent),inset 0 0 24px color-mix(in srgb,var(--primary) 45%,transparent)}
.app-icon svg{width:76px;height:auto;filter:drop-shadow(0 0 8px var(--accent))}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--r-pill);font-weight:700;font-size:15px;transition:transform .15s, filter .15s}
.btn:active{transform:scale(.97)}
a.btn{text-decoration:none;color:#fff}
.btn-p{background:linear-gradient(180deg,color-mix(in srgb,var(--electric) 60%,var(--primary)),var(--primary));color:#fff;box-shadow:0 8px 26px -8px color-mix(in srgb,var(--electric) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-g{background:color-mix(in srgb,var(--surface2) 80%,transparent);border:1px solid var(--line)}
.btn-sm{min-height:38px;padding:0 16px;font-size:13.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--surface2) 75%,transparent);border:1px solid var(--line);position:relative;flex:none}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* Puces */
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;background:color-mix(in srgb,var(--surface2) 70%,transparent);border:1px solid var(--line);white-space:nowrap}
.chip .ico{width:16px;height:16px}
.chip.on{background:var(--primary);border-color:var(--electric);color:#fff;box-shadow:0 0 14px -4px var(--electric)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.tag{white-space:nowrap;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);background:rgba(255,255,255,.08);color:var(--text2);letter-spacing:.03em;display:inline-flex;align-items:center;gap:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#fff;background:color-mix(in srgb,var(--live) 85%,transparent);padding:4px 10px;border-radius:var(--r-pill)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
.st{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);background:rgba(255,255,255,.06)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.st.on{color:var(--ok)}.st.soon{color:var(--warn)}
.plus{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--warn),var(--accent));color:#1a0b2e}
.gold{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-pill);color:#FFD66B;background:rgba(255,201,60,.14);border:1px solid rgba(255,201,60,.4)}
@keyframes blink{50%{opacity:.3}}

/* Cartes */
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--surface2) 85%,transparent),color-mix(in srgb,var(--surface) 92%,transparent));border:1px solid var(--line);border-radius:var(--r-card);padding:16px;box-shadow:inset 0 0 24px -12px color-mix(in srgb,var(--electric) 60%,transparent)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--electric) 40%,transparent), transparent 55%),linear-gradient(150deg,color-mix(in srgb,var(--primary) 55%,var(--bg)),var(--surface) 70%)}
.hero .planet{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0, color-mix(in srgb,var(--accent) 60%,#fff) 8%, var(--electric) 35%, var(--primary) 65%, transparent 72%);
  box-shadow:0 0 60px 10px color-mix(in srgb,var(--electric) 45%,transparent);opacity:.8}
.hero .ring{position:absolute;right:-60px;top:40px;width:230px;height:46px;border-radius:50%;border:2px solid color-mix(in srgb,var(--cyan) 55%,transparent);transform:rotate(-18deg)}
.hero>*:not(.planet):not(.ring):not(.art-r){position:relative}
.art-r{position:absolute;inset:0 0 0 auto;width:52%;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.feature{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line)}
.feature .art{height:150px;background-size:cover;background-position:center 40%}
.exp-card{position:relative;margin-top:-34px;padding:16px 18px 18px;border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface2) 92%,transparent),var(--surface));border-top:1px solid color-mix(in srgb,var(--electric) 45%,transparent)}
.exp-card>*:not(.exp-img){max-width:64%}
.exp-img{position:absolute;right:8px;bottom:0;height:128px;width:auto;-webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.room-card{display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0}
.room-card .cover{height:92px;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;background-size:cover;background-position:center}
.room-card .cover .ico{position:absolute;right:12px;top:12px;width:44px;height:44px;opacity:.95;stroke-width:1.5;filter:drop-shadow(0 0 8px rgba(255,255,255,.6))}
.faces{display:flex}
.faces>*{margin-left:-8px;border-radius:50%;border:2px solid var(--surface);background:var(--surface)}
.faces>*:first-child{margin-left:0}
.count{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;text-align:left;width:100%;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);min-width:0}
.list-item .grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--c2,#fff);background:color-mix(in srgb,var(--c1,var(--primary)) 25%,var(--surface));border:1px solid color-mix(in srgb,var(--c1,var(--primary)) 55%,transparent);box-shadow:0 0 16px -4px var(--c1,var(--primary))}
.glyph .ico{filter:drop-shadow(0 0 6px currentColor)}
.com-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.com-tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:22px;min-width:0;
  background:linear-gradient(165deg,color-mix(in srgb,var(--c1) 26%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c1) 50%,transparent);box-shadow:inset 0 0 22px -10px var(--c1)}
.com-tile .big{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px;color:#fff;background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1) 70%);box-shadow:0 0 22px -2px var(--c1)}
.com-tile .big .ico{width:30px;height:30px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{aspect-ratio:1/1.02;max-width:100%;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 6px;text-align:center;font-weight:700;font-size:12.5px;line-height:1.2;color:#fff;
  background:linear-gradient(165deg,color-mix(in srgb,var(--c1) 30%,var(--surface)),color-mix(in srgb,var(--c1) 8%,var(--surface)) 80%);border:1px solid color-mix(in srgb,var(--c1) 55%,transparent);box-shadow:inset 0 0 20px -8px var(--c1),0 0 14px -10px var(--c1)}
.cat .ico{width:36px;height:36px;stroke-width:1.7;color:var(--c2);filter:drop-shadow(0 0 7px var(--c2))}
.cat.on{outline:2.5px solid #fff;outline-offset:2px}
.cat.dim{opacity:.6}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:var(--muted)}
.demo-note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--text2);padding:10px 12px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent)}
.demo-note b{color:var(--warn)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line)}
.tabs button{flex:1;padding:9px 6px;border-radius:var(--r-pill);font-weight:700;font-size:13px;color:var(--text2)}
.tabs button.on{background:var(--primary);color:#fff;box-shadow:0 0 16px -4px var(--electric)}
.utabs{display:flex;border-bottom:1px solid var(--line2)}
.utabs button{flex:1;padding:10px 4px 12px;font-weight:700;font-size:14px;color:var(--muted);position:relative}
.utabs button.on{color:#fff}
.utabs button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:var(--electric);box-shadow:0 0 10px var(--electric)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:flex;align-items:center;gap:6px;font-weight:700}

/* Navigation basse */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);z-index:20;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:72px;border-radius:28px;padding:0 6px 9px;
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 -10px 40px -10px rgba(0,0,0,.6)}
.nav-b{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);padding-top:8px}
.nav-b.on{color:#fff}
.nav-b.on .ico{stroke:var(--electric);filter:drop-shadow(0 0 6px var(--electric))}
.mic-wrap{display:flex;flex-direction:column;align-items:center}
.pulse-btn{position:relative;width:72px;height:72px;margin-top:-36px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;
  background:radial-gradient(circle at 50% 38%,#2E1670,#0E0628 72%);box-shadow:0 0 0 5px var(--bg),0 0 26px 2px color-mix(in srgb,var(--electric) 70%,transparent),inset 0 0 16px color-mix(in srgb,var(--electric) 55%,transparent)}
.pulse-btn::before{content:"";position:absolute;inset:0;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--accent),var(--electric) 45%,var(--cyan));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.pulse-btn svg{width:34px;height:auto;filter:drop-shadow(0 0 6px var(--accent))}
.pulse-btn span{font-family:var(--f-brand);font-style:italic;font-weight:800;font-size:10px;letter-spacing:.12em}
.pulse-btn .ico{width:28px;height:28px}
.pulse-btn::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.pulse-btn.hot{background:radial-gradient(circle at 50% 38%,#8A1F7A,#2A0A3A 75%)}
.pulse-btn.hot::after{animation:ring 1.1s infinite}
.pulse-btn.off{filter:saturate(.35) brightness(.85)}
.mic{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 38%,#331A78,#120830 72%);box-shadow:0 0 30px 2px color-mix(in srgb,var(--electric) 65%,transparent),inset 0 0 18px color-mix(in srgb,var(--electric) 60%,transparent)}
.mic::before{content:"";position:absolute;inset:0;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--accent),var(--electric) 45%,var(--cyan));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.mic .ico{width:32px;height:32px;stroke-width:2;filter:drop-shadow(0 0 6px var(--electric))}
.mic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.mic.hot{background:radial-gradient(circle at 50% 38%,#C02A8E,#3A0B4A 78%)}
.mic.hot::after{animation:ring 1.1s infinite}
.mic.off{background:radial-gradient(circle at 50% 38%,#3A3352,#16122A 78%);box-shadow:none}
.mic.off::before{background:linear-gradient(135deg,#6B6385,#3B3552)}
@keyframes ring{0%{transform:scale(.95);opacity:.85}100%{transform:scale(1.5);opacity:0}}
.mini-room{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),416px);z-index:19;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:18px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--primary) 55%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--electric) 50%,transparent);text-align:left}

/* Salon vocal */
.salon-card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,color-mix(in srgb,var(--primary) 35%,var(--surface)),var(--surface) 75%);border:1px solid var(--line)}
.salon-card .art{width:92px;height:92px;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:0 0 26px -4px var(--electric);border:2px solid color-mix(in srgb,var(--electric) 60%,transparent);display:grid;place-items:center}
.salon-card .art .ico{width:42px;height:42px}
.salon-card .wv{position:absolute;right:10px;bottom:8px;height:34px;width:110px;opacity:.35}
.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;justify-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;text-align:center;min-width:0;max-width:100%}
.seat .av{position:relative;border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--electric) 55%,transparent)}
.seat .av.speaking{box-shadow:0 0 0 3px var(--accent),0 0 22px 4px color-mix(in srgb,var(--accent) 60%,transparent);animation:talk 1s ease-in-out infinite}
@keyframes talk{50%{box-shadow:0 0 0 4px var(--electric),0 0 30px 8px color-mix(in srgb,var(--electric) 55%,transparent)}}
.seat .badge{position:absolute;bottom:-2px;right:-2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--primary);border:2px solid var(--bg)}
.seat .badge .ico{width:13px;height:13px}
.seat .crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:26px;height:20px;color:#FFC93C;filter:drop-shadow(0 0 6px #FFC93C)}
.host-pill{font-size:11px;font-weight:800;padding:2px 10px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--accent),var(--electric));color:#fff;margin-top:-12px;position:relative}
.role{font-size:10.5px;color:var(--text2);font-weight:600}
.invite-seat{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed color-mix(in srgb,var(--electric) 70%,transparent);color:var(--text2)}
.room-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);z-index:20;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.room-bar .in{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;border-radius:28px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
.room-bar .ctr{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;justify-items:center;gap:6px}

 UI.cg={deck,disc:[top],top,color:top.c,hands,turn:0,dir:1,pulsed:false,log:'À toi de commencer !',over:null}}
const nextI=(cg,step=1)=>(cg.turn+cg.dir*step+400)%4;

function p4Win(b,pl){const d=[[0,1],[1,0],[1,1],[1,-1]];for(let r=0;r<6;r++)for(let c=0;c<7;c++){if(b[r][c]!==pl)continue;for(const [dr,dc] of d){const cells=[[r,c]];for(let k=1;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>5||cc<0||cc>6||b[rr][cc]!==pl)break;cells.push([rr,cc])}if(cells.length===4)return cells}}return null}
const p4Drop=(b,c,pl)=>{for(let r=5;r>=0;r--)if(!b[r][c]){b[r][c]=pl;return r}return -1};
function p4Bot(){const g=UI.p4,b=g.b;const free=[0,1,2,3,4,5,6].filter(c=>!b[0][c]);if(!free.length)return;
 const tryC=pl=>free.find(c=>{const t=b.map(r=>[...r]);p4Drop(t,c,pl);return p4Win(t,pl)});
 let c=tryC(2);if(c===undefined)c=tryC(1);if(c===undefined){const pref=[3,2,4,1,5,0,6].filter(x=>free.includes(x));c=Math.random()<.7?pref[0]:pref[Math.floor(Math.random()*pref.length)]}
 p4Drop(b,c,2);const w=p4Win(b,2);if(w){g.win=w;g.who=2}else if(b[0].every(x=>x))g.who=0;g.turn=1}

 g.phase='done';if(V.name==='bac')render()}

/* ----- Communauté ----- */
com:(id)=>{const c=com(id),k=cat(id),j=S.joined.includes(id),rs=allRooms().filter(r=>r.com===id),as=ACTS.filter(a=>a.com===id);
 const members=[...new Set(rs.flatMap(r=>[r.host,...r.speakers]))].filter(x=>x!=='me');
 const liveR=rs.find(r=>r.live), tab=UI.comTab, img=COMART[id];
 return `<div class="scr">
 <div class="com-hero" style="${img?`background-image:url(${img})`:`background:radial-gradient(80% 90% at 70% 20%,${k.g[1]}99,transparent 60%),linear-gradient(160deg,${k.g[0]},var(--bg))`}">
  <div class="row between"><button class="icon-btn" data-a="back" aria-label="Retour">${ic('back')}</button><div class="row"><button class="icon-btn" data-a="invite" data-v="${liveR?liveR.id:id}" aria-label="Partager">${ic('share')}</button><button class="icon-btn" data-a="rules" aria-label="Règles">${ic('dots')}</button></div></div>
  ${img?'':`<div style="align-self:center;color:#fff;filter:drop-shadow(0 0 20px ${k.g[1]})">${ic(k.icon).replace('class="ico "','class="ico" style="width:84px;height:84px;stroke-width:1.3"')}</div>`}
  <span class="faces-pill"><span class="faces">${members.slice(0,4).map(p=>avatar(PEOPLE[p].av,24)).join('')}</span>+${fmt(Math.round(c.members/500))}</span></div>
 <div class="stack" style="gap:8px"><div class="row">${glyph(k)}<h1 style="font-size:30px">${esc(c.name)}</h1></div><p class="muted">${esc(c.tagline)}</p>
  <div class="row wrap" style="gap:8px">${c.tags.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>
 ${liveR?`<button class="btn btn-p btn-block" data-a="open-room" data-v="${liveR.id}">Rejoindre le salon ${ic('headphones')}</button>`:`<button class="btn btn-p btn-block" data-a="go" data-v="create" data-p="${id}">${ic('plus')} Lancer le premier salon</button>`}
 <div class="row between"><span class="count">${fmt(c.members)} membres · chiffres d’exemple</span><button class="chip ${j?'on':''}" data-a="join" data-v="${id}">${j?ic('check')+' '+t('member'):ic('plus')+' Suivre'}</button></div>
 <div class="utabs" role="tablist">${[['about','À propos'],['acts',t('acts')],['members','Membres']].map(([k2,l])=>`<button role="tab" class="${tab===k2?'on':''}" data-a="com-tab" data-v="${k2}">${l}</button>`).join('')}</div>
 ${tab==='about'?`<p>${esc(c.about)}</p>
  ${as.filter(a=>a.status!=='done').length?`<section class="stack"><div class="sec-h"><h2>Activités en cours</h2><button class="link" data-a="com-tab" data-v="acts">${t('seeall')} ${ic('arrow')}</button></div>${as.filter(a=>a.status!=='done').slice(0,1).map(a=>`<button class="list-item" style="padding:14px" data-a="open-act" data-v="${a.id}"><div class="glyph" style="${cv(k)};width:58px;height:58px;border-radius:18px">${ic('star')}</div><div class="grow"><span class="st ${a.status==='live'?'on':'soon'}">${a.status==='live'?t('live'):esc(a.when)}</span><div style="font-weight:700;margin-top:4px">${esc(a.kind==='Audition à l’aveugle'?'Audition à l’aveugle':a.title)}</div><div class="small muted">${esc(a.kind==='Audition à l’aveugle'?'Qui a la plus belle voix ?':a.desc)}</div></div>${ic('chev')}</button>`).join('')}</section>`:''}
  <section class="stack"><h2>${t('rooms')}</h2>${rs.map(roomCard).join('')||'<p class="muted">Aucun salon pour l’instant.</p>'}
  <button class="btn btn-g" data-a="go" data-v="create" data-p="${id}">${ic('plus')} Créer un salon ${esc(c.name)}</button></section>
  <button class="list-item" data-a="rules">${ic('shield')}<div class="grow"><div style="font-weight:700">Règles du salon</div><div class="small muted">${esc(c.rules[0])}</div></div>${ic('chev')}</button>`:''}
 ${tab==='acts'?(as.map(actCard).join('')||'<p class="muted">Pas encore d’activité dans cette communauté.</p>'):''}
 ${tab==='members'?`<div class="stack">${members.map(personRow).join('')}</div>`:''}
 ${nav('')}</div>`},

/* ----- Salon vocal ----- */
room:(id)=>{const r=room(id),c=com(r.com),k=cat(r.com),inR=R&&R.id===id,img=r.com==='musique'?'assets/salon-art.webp':'';
 const seat=(pid,role,speaking)=>{const p=person(pid);const isMe=pid==='me';const muted=isMe?R.muted:!speaking;const host=role==='Hôte';
  return `<div class="seat"><div class="av ${speaking?'speaking':''}">${host?`<svg class="crown" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 5l5 4 5-7 5 7 5-4-2 12H4z" fill="currentColor"/></svg>`:''}${avatar(p.av,host?72:60)}${host?'':`<span class="badge">${ic(muted?'micoff':'mic')}</span>`}</div>${host?'<span class="host-pill">Hôte</span>':''}<span class="ellip" style="max-width:80px">${esc(isMe?'Toi':p.name)}</span></div>`};
 const sp=[...r.speakers];
 const meSpeaker=inR&&R.role!=='listener';
 const head=`<div class="top"><button class="back" data-a="back" aria-label="Retour" style="flex:1;min-width:0">${ic('back')}<span style="text-align:left;line-height:1.2;min-width:0" class="ellip">${esc(c.name)}<br><span class="small muted" style="font-weight:500">${fmt(Math.round(c.members/40))} membres en ligne</span></span></button>
  <div class="row"><button class="chip ${S.joined.includes(r.com)?'':'on'}" data-a="join" data-v="${r.com}">${S.joined.includes(r.com)?ic('check')+' '+t('member'):ic('plus')+' '+t('join')}</button><button class="icon-btn cc-btn" data-a="cc" aria-pressed="${!!UI.cc}" aria-label="Sous-titres en direct">CC</button><button class="icon-btn" data-a="room-menu" data-v="${r.id}" aria-label="Plus d’options">${ic('dots')}</button></div></div>`;
 const card=`<div class="salon-card"><div class="art" style="${img?`background-image:url(${img})`:`background:radial-gradient(circle at 35% 30%,${k.g[1]},${k.g[0]} 70%)`}">${img?'':ic(k.icon)}</div>
  <svg class="wv" viewBox="0 0 120 60" aria-hidden="true">${Array.from({length:30},(_,i)=>{const h=6+Math.abs(Math.sin(i*1.7)*22)+(i%5)*3;return `<rect x="${i*4}" y="${30-h/2}" width="2" height="${h}" rx="1" fill="#C084FC"/>`}).join('')}</svg>
  <div class="stack" style="gap:6px;min-width:0;position:relative"><h2 style="font-size:19px">${esc(r.title)}</h2><p class="small muted">${esc(c.tagline)}</p>
  <div class="row wrap" style="gap:6px"><span class="tag">${ic(k.icon).replace('class="ico "','class="ico" style="width:13px;height:13px"')} ${esc(c.name)}</span>${r.langs.map(l=>`<span class="tag">${l}</span>`).join('')}${r.private?`<span class="tag">${ic('lock').replace('class="ico "','class="ico" style="width:13px;height:13px"')} Privé</span>`:''}</div></div></div>`;
 if(!r.live&&!inR) return `<div class="scr">${head}${card}<span class="tag" style="align-self:flex-start">${esc(r.when)}</span>
  <p class="muted">Ce salon n’a pas encore commencé. Hôte : ${esc(person(r.host).name)}.</p><button class="btn btn-p" data-a="remind-room" data-v="${r.id}">${ic('bell')} Me prévenir au début</button>${demo('<b>Prototype :</b> le rappel est noté sur cet appareil, sans notification réelle.')}${nav('')}</div>`;
 return `<div class="scr in-room">${head}${card}
 <div class="row between"><span class="live">${t('live')}</span><span class="count" id="rc-count">${countTxt(r)}</span></div>
 ${demo('<b>Audio non branché :</b> ce salon est une démonstration visuelle. Aucun son n’est capté ni diffusé.')}
 ${r.act?`<button class="list-item" data-a="open-act" data-v="${r.act}" style="border-color:color-mix(in srgb,var(--accent) 50%,transparent)">${glyph(k,'star')}<div class="grow"><div class="eyebrow">Activité en cours</div><div style="font-weight:700">${esc(ACTS.find(a=>a.id===r.act).title)}</div></div><span class="link">Ouvrir</span></button>`:''}
 <section class="stack"><h2>Sur scène</h2><div class="stage" style="padding-top:12px">${r.host==='me'?seat('me','Hôte',inR&&!R.muted):seat(r.host,'Hôte',true)}${sp.map((s,i)=>seat(s,'',i===0&&!(inR&&!R.muted))).join('')}${meSpeaker&&r.host!=='me'?seat('me','',!R.muted):''}
  <button class="seat" data-a="invite" data-v="${r.id}"><span class="invite-seat">${ic('plus')}</span><span>Inviter</span></button></div></section>
 <section class="stack"><h2>À l’écoute</h2><div class="row wrap" style="gap:10px">${(inR&&R.role==='listener'?`<div class="seat">${avatar(S.av,48)}<span>Toi</span></div>`:'')}${Object.keys(PEOPLE).filter(p=>p!==r.host&&!sp.includes(p)).slice(0,5).map(p=>`<div class="seat">${avatar(PEOPLE[p].av,48)}<span>${esc(PEOPLE[p].name)}</span></div>`).join('')}${r.listeners>5?`<div class="seat"><div style="width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:800;font-size:12px">+${fmt(r.listeners-5)}</div><span>autres</span></div>`:''}</div></section>
 <section class="stack" id="real-peers">${realPeers(r.id)}</section>
 </div>
 <div class="cc" id="cc" data-com="${r.com}" aria-live="polite">${UI.cc?ccLine(r.com):feedLine(r)}</div>
 <div class="room-bar"><div class="in">${roomMic(r)}</div></div>`;
},

talkie:()=>{const real=S.friends.filter(f=>!S.blocked.includes(f)&&PEOPLE[f]);const fr=real.length?real:['lea','marco','nora'];
 if(UI.tw!=='all'&&!fr.includes(UI.tw))UI.tw=fr[0];const who=UI.tw==='all'?null:PEOPLE[UI.tw];const target=who?who.name:'tout le groupe';
 return `<div class="scr">${topBar('Talkie-walkie')}

 <div class="tw-grid">${fr.map(f=>`<button class="tw-f ${UI.tw===f?'on':''} ${UI.twIn===f?'talk':''}" data-a="tw-pick" data-v="${f}" aria-pressed="${UI.tw===f}"><span class="av">${avatar(PEOPLE[f].av,56)}</span><span class="ellip" style="max-width:70px">${esc(PEOPLE[f].name)}</span></button>`).join('')}

 <button class="mic ptt" id="ptt" aria-label="Maintenir pour parler à ${esc(target)}">${ic('mic')}</button>

 ${demo('<b>Prototype :</b> aucun son n’est capté ni transmis. Dans la vraie appli, ta voix part en direct, pendant que tu parles.')}
 ${nav('')}</div>`},

 <div class="table-mid"><button class="gcard big back" data-a="cg-draw" ${myTurn?'':'disabled'} aria-label="Piocher">${ic('plus')}</button>${cardHTML(cg.top,'big')}</div>
 <div class="row" style="justify-content:center;gap:8px"><span class="tag" style="background:${GC[cg.color]};color:#0A0520">Couleur : ${GCN[cg.color]}</span><span class="tag">${cg.dir>0?'Sens horaire':'Sens inverse'}</span></div>
 <p class="mic-state" aria-live="polite">${esc(cg.log)}</p>
 ${cg.over!==null?`<button class="btn btn-p" data-a="cg-new">Rejouer</button>`:`<p class="small muted" style="text-align:center">${myTurn?'À toi : touche une carte surlignée, ou pioche.':'Les autres jouent…'}</p>`}
 <div class="hand">${me.map((k,i)=>cardHTML(k,myTurn&&canPlay(k,cg)?'ok':'',`data-a="cg-play" data-v="${i}" ${myTurn&&canPlay(k,cg)?'':'disabled'}`)).join('')}</div>
 ${me.length===2&&myTurn?`<button class="btn ${cg.pulsed?'btn-g':'btn-p'}" data-a="cg-pulse">${cg.pulsed?ic('check')+' Pulse ! annoncé':'Annoncer « Pulse ! »'}</button><p class="small muted" style="text-align:center">Annonce « Pulse ! » avant de poser ton avant-dernière carte, sinon +2 cartes.</p>`:''}
 ${nav('')}</div>`},

intrus:()=>{const g=UI.ig;if(!g){igNew();return VIEWS.intrus()}
 const seat=(i,extra='')=>`<div class="seat">${avatar(i===0?S.av:PEOPLE[BOTS[i-1]].av,56)}<span>${igName(i)}</span>${extra}</div>`;
 let body='';
 if(g.phase==='clue')body=`<div class="card stack" style="align-items:center;text-align:center"><span class="eyebrow">Ton mot secret</span><div class="word">${esc(g.words[0])}</div><span class="small muted">Tu ne sais pas si tu es l’intrus : ton mot est peut-être différent de celui des autres.</span></div>
  <div class="field"><label for="ig-clue">Ton indice (un mot, sans dire ton mot)</label><input class="inp" id="ig-clue" maxlength="24" autocomplete="off" placeholder="Dans l’appli, tu le dis au micro"></div><p class="err" id="ig-err"></p><button class="btn btn-p" data-a="ig-clue">Donner mon indice</button>`;
 if(g.phase==='vote')body=`<div class="stack">${g.clues.map((c,i)=>`<div class="list-item">${avatar(i===0?S.av:PEOPLE[BOTS[i-1]].av,40)}<div class="grow"><b>${igName(i)}</b><div class="small muted">« ${esc(c)} »</div></div>${i?`<button class="chip" data-a="ig-vote" data-v="${i}">Voter</button>`:''}</div>`).join('')}</div><p class="small muted">Ton mot : <b>${esc(g.words[0])}</b>. Qui est l’intrus ?</p>`;
 if(g.phase==='result'){const ok=g.out===g.intr;const meIntr=g.intr===0;const win=meIntr?!ok:ok;
  body=`<div class="card stack" style="text-align:center;align-items:center"><span class="gold">${win?ic('trophy')+' Victoire':ic('x')+' Perdu'}</span><h2>${g.out===null?'Égalité : personne n’est éliminé':igName(g.out)+' est éliminé·e'}</h2><p class="muted">L’intrus était <b>${igName(g.intr)}</b>${meIntr?' : c’était toi !':''}</p><p class="small muted">Mot des autres : <b>${esc(g.words[g.intr===0?1:0])}</b> · mot de l’intrus : <b>${esc(g.words[g.intr])}</b></p></div>
  <div class="stack">${[0,1,2,3].map(i=>`<div class="list-item">${avatar(i===0?S.av:PEOPLE[BOTS[i-1]].av,32)}<div class="grow small"><b>${igName(i)}</b> a voté ${igName(g.votes[i])}</div></div>`).join('')}</div><button class="btn btn-p" data-a="ig-new">Nouvelle manche</button>`}
 return `<div class="scr">${topBar('L’Intrus')}<div class="stage">${[0,1,2,3].map(i=>seat(i)).join('')}</div>${body}
 ${demo('<b>Prototype :</b> Léa, Marco et Nora sont simulés. Dans l’appli, chacun dit son indice au micro, dans un salon ou entre amis.')}${nav('')}</div>`},

quiz:()=>{const z=UI.qz;
 if(!z||z.phase==='pick')return `<div class="scr">${topBar('Quiz')}<p class="muted">Choisis un thème : 5 questions, 12 secondes chacune. Bonne réponse = 100 points, plus un bonus de rapidité.</p>
  <div class="g-grid">${Object.keys(QZ_TH).map((k,i)=>`<button class="g-mini" style="--c1:${['#4F46E5','#8B5CF6','#FF4F7B','#0891B2','#059669','#6366F1','#F59E0B'][i]};--c2:#22D3EE" data-a="qz-th" data-v="${k}"><span class="gi">${['🧠','🎵','🎬','🌍','⚽','🔬','😀'][i]}</span><b>${QZ_TH[k]}</b></button>`).join('')}</div>${nav('')}</div>`;
 if(z.phase==='end'){const rk=PL.map(k=>[k,z.sc[k]]).sort((a,b)=>b[1]-a[1]);return `<div class="scr">${topBar('Quiz · '+QZ_TH[z.th])}<div class="card stack" style="align-items:center;text-align:center"><span class="gold">${ic('trophy')} ${rk[0][0]==='me'?'Victoire !':plName(rk[0][0])+' gagne'}</span><h2>Classement</h2></div>
  <div class="stack">${rk.map(([k,v],i)=>`<div class="list-item"><b style="width:22px">${i+1}</b>${avatar(plAv(k),36)}<div class="grow" style="font-weight:700">${plName(k)}</div><span class="tag">${v} pts</span></div>`).join('')}</div>
  <button class="btn btn-p" data-a="qz-th" data-v="${z.th}">Rejouer</button><button class="btn btn-g" data-a="qz-pick">Changer de thème</button>${nav('')}</div>`}
 const q=z.qs[z.i],rev=z.phase==='rev',emo=z.th==='emoji';const parts=emo?q.q.split(' · '):null;const left=Math.max(0,Math.ceil((z.end-Date.now())/1000));
 return `<div class="scr" style="gap:16px">${topBar('Quiz · '+QZ_TH[z.th])}${scoreRow(z.sc)}
  <div class="row between"><span class="tag">Question ${z.i+1}/${z.qs.length}</span><span class="tag" id="qz-t">${rev?'Terminé':left+' s'}</span></div>
  <div class="bar"><i id="qz-bar" style="width:${rev?0:left/12*100}%"></i></div>
  ${emo?`<div class="qz-emoji">${esc(parts[0])}</div><p class="qz-q" style="text-align:center">${esc(parts[1])}</p>`:`<p class="qz-q">${esc(q.q)}</p>`}
  <div class="stack" style="gap:8px">${q.o.map((o,i)=>`<button class="ans ${rev&&i===q.a?'good':''} ${rev&&i===z.my&&i!==q.a?'bad':''} ${!rev&&i===z.my?'good':''}" data-a="qz-ans" data-v="${i}" ${z.my!==null||rev?'disabled':''}>${esc(o)}</button>`).join('')}</div>
  ${rev?`<div class="card small">${PL.map(k=>`<div class="row between"><span>${plName(k)}</span><b style="color:${z.gain[k]?'var(--ok)':'var(--muted)'}">${z.gain[k]?'+'+z.gain[k]:'0'}</b></div>`).join('')}</div><button class="btn btn-p" data-a="qz-next">${z.i+1<z.qs.length?'Question suivante':'Voir le classement'}</button>`:`<p class="small muted" style="text-align:center">${z.my!==null?'Réponse enregistrée…':'Réponds vite pour gagner plus de points'}</p>`}
  ${nav('')}</div>`},

bac:()=>{const g=UI.bac;if(!g){bacStart();return VIEWS.bac()}const left=Math.max(0,Math.ceil((g.end-Date.now())/1000));
 if(g.phase==='play')return `<div class="scr no-nav" style="gap:14px">${topBar('Petit bac')}
  <div class="card row between"><div><span class="eyebrow">Lettre</span><div class="word" style="text-align:left">${g.l}</div></div><span class="timer" id="bac-t" style="font-size:30px">${left} s</span></div>
  <div class="stack" style="gap:10px">${BAC_CATS.map((c,i)=>`<div class="bac-row"><label for="bac-${i}" class="small" style="font-weight:700">${c}</label><input class="inp" id="bac-${i}" autocomplete="off" placeholder="${g.l}…" value="${esc(g.mine[i])}"></div>`).join('')}</div>
  <button class="btn btn-p" data-a="bac-stop">Stop !</button><p class="small muted">10 points pour un mot que personne d’autre n’a trouvé, 5 s’il est partagé. Dans l’appli, le groupe valide les mots.</p></div>`;

  <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr><th style="text-align:left;padding:6px">Catégorie</th>${PL.map(k=>`<th style="padding:6px">${plName(k)}</th>`).join('')}</tr></thead><tbody>${BAC_CATS.map((c,i)=>`<tr style="border-top:1px solid var(--line2)"><td style="padding:6px;font-weight:700">${c}</td><td style="padding:6px;color:${g.ok[i]?'var(--ok)':'var(--live)'}">${esc(g.mine[i]||'—')}</td>${g.bots.map(b=>`<td style="padding:6px">${esc(b[i]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <button class="btn btn-p" data-a="bac-open">Nouvelle lettre</button>${nav('')}</div>`},

pendu:()=>{const g=UI.pd;const shown=g.w.split('').map(ch=>g.found.includes(ch)?ch:'_').join('');const won=!shown.includes('_'),lost=g.err>=7;
 return `<div class="scr">${topBar('Pendu')}
  <div class="row" style="justify-content:center;gap:4px" aria-label="${7-g.err} vies restantes">${Array.from({length:7},(_,i)=>`<span style="font-size:20px;opacity:${i<7-g.err?1:.2}">💜</span>`).join('')}</div>
  <div class="hang" aria-live="polite">${won||lost?g.w:shown}</div>
  ${won?`<div class="card" style="text-align:center"><b>Bravo, mot trouvé !</b></div>`:lost?`<div class="card" style="text-align:center"><b>Perdu…</b> le mot était ${g.w}</div>`:`<p class="small muted" style="text-align:center">Thème : musique, sorties et amitié</p>`}
  ${won||lost?`<button class="btn btn-p" data-a="pendu-open">Nouveau mot</button>`:`<div class="kb">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button data-a="pd-l" data-v="${l}" ${g.tried.includes(l)?'disabled':''}>${l}</button>`).join('')}</div>`}
  <p class="small muted">En groupe : chacun propose une lettre à son tour, au micro.</p>${nav('')}</div>`},

p4:()=>{const g=UI.p4;const msg=g.win?(g.who===1?'Tu as gagné !':'Le bot gagne cette fois.'):g.who===0?'Match nul.':g.turn===1?'À toi : touche une colonne.':'Le bot réfléchit…';

  <div class="row" style="justify-content:center;gap:16px"><span class="tag" style="color:var(--accent)">● Toi</span><span class="tag" style="color:var(--cyan)">● Marco (bot)</span></div>
  <div class="p4">${g.b.map((row,r)=>row.map((v,c)=>`<button class="${v===1?'y':v===2?'b':''} ${g.win&&g.win.some(([a,b])=>a===r&&b===c)?'w':''}" data-a="p4-col" data-v="${c}" aria-label="Colonne ${c+1}"></button>`).join('')).join('')}</div>
  <p class="mic-state" aria-live="polite">${msg}</p>${g.win||g.who===0?`<button class="btn btn-p" data-a="p4-open">Rejouer</button>`:''}
  <p class="small muted">Dans l’appli : à deux, en vocal, pendant une conversation.</p>${nav('')}</div>`},

tpref:()=>{const g=UI.tp||(UI.tp={i:0,pick:null});const pr=TP[g.i%TP.length];const pa=35+(g.i*37)%31;
 return `<div class="scr">${topBar('Tu préfères ?')}<p class="eyebrow">Question ${g.i%TP.length+1}/${TP.length}</p>
  <div class="stack">${pr.map((o,k)=>{const pc=k?100-pa:pa;return `<button class="ans pct ${g.pick===k?'good':''}" data-a="tp-pick" data-v="${k}" ${g.pick!==null?'disabled':''}>${g.pick!==null?`<span class="fill" style="width:${pc}%"></span>`:''}<span style="font-size:17px">${esc(o)}</span>${g.pick!==null?`<span class="small muted" style="display:block">${pc} % des joueurs (exemple)</span>`:''}</button>`}).join('<p style="text-align:center;font-weight:800;margin:0">ou</p>')}</div>
  ${g.pick!==null?`<div class="card small">${BOTS.map((b,i)=>`<div class="row between"><span>${PEOPLE[b].name}</span><b>${esc(pr[(g.i+i)%2])}</b></div>`).join('')}</div><button class="btn btn-p" data-a="tp-next">Question suivante</button>`:''}
  <p class="small muted">En salon : chacun explique son choix au micro.</p>${nav('')}</div>`},

quinous:()=>{const g=UI.qn;const q=QN[g.i%QN.length];
 return `<div class="scr">${topBar('Qui de nous ?')}<div class="card"><p class="qz-q">${esc(q)}</p></div>

  :`<div class="stage">${PL.map(k=>`<button class="seat" data-a="qn-vote" data-v="${k}"><span class="av">${avatar(plAv(k),60)}</span><span>${plName(k)}</span></button>`).join('')}</div><p class="small muted" style="text-align:center">Touche la personne de ton choix.</p>`}${nav('')}</div>`},

aov:()=>{const g=UI.av||(UI.av={turn:0,card:null,type:null});const k=PL[g.turn%4];
 return `<div class="scr">${topBar('Action ou vérité')}
  <div class="stack" style="align-items:center;gap:6px">${avatar(plAv(k),80)}<b>Au tour de ${k==='me'?'toi':plName(k)}</b></div>
  ${g.card?`<div class="card stack" style="text-align:center;align-items:center"><span class="gold">${g.type==='a'?'Action':'Vérité'}</span><p class="qz-q">${esc(g.card)}</p>${k!=='me'?`<p class="small muted">${plName(k)} répond au micro (simulé).</p>`:''}</div><button class="btn btn-p" data-a="av-next">Joueur suivant</button>`
  :k==='me'?`<div class="row"><button class="btn btn-p" style="flex:1" data-a="av-pick" data-v="a">Action</button><button class="btn btn-g" style="flex:1" data-a="av-pick" data-v="v">Vérité</button></div>`:`<button class="btn btn-p" data-a="av-bot">Voir le choix de ${plName(k)}</button>`}
  <p class="small muted">Questions et défis gentils, adaptés à tout le monde. On peut toujours passer son tour.</p>${nav('')}</div>`},

call:()=>{if(!CALL)return VIEWS.messages();const p=PEOPLE[CALL.who],ring=CALL.st==='ring';
 return `<div class="scr" style="gap:18px">${topBar('Appel')}
 <div class="stack" style="align-items:center;text-align:center;gap:10px;padding-top:6px"><div class="duo-face"><div class="seat"><div class="av ${!CALL.muted&&!ring?'speaking':''}">${avatar(S.av,96)}</div><span>Toi</span></div>${ic('phone')}<div class="seat"><div class="av ${ring?'':'speaking'}">${avatar(p.av,96)}</div><span>${esc(p.name)}</span></div></div>
  <div class="timer" id="call-t">${ring?'Ça sonne…':callTime()}</div><span class="st ${ring?'soon':'on'}">${ring?'Appel en cours':'En appel vocal'}</span></div>
 ${ring?'':`<div class="card small" id="call-cc" aria-live="polite"><b style="color:var(--electric)">${esc(p.name)}</b> ${esc(CALLLINES[CALL.li%CALLLINES.length])}</div>`}
 <div class="call-ctr"><button class="rb ${CALL.muted?'on':''}" data-a="call-mute" aria-pressed="${CALL.muted}" aria-label="${CALL.muted?'Réactiver le micro':'Couper le micro'}">${ic(CALL.muted?'micoff':'mic')}</button><button class="rb" data-a="chat" data-v="${CALL.who}" aria-label="Messages">${ic('message')}</button><button class="rb end" data-a="call-end" aria-label="Raccrocher">${ic('phone')}</button></div>
 <section class="stack"><h2>Pendant l’appel</h2><div class="g-grid">

  <button class="g-mini" style="--c1:#FF4F7B;--c2:#F59E0B" data-a="call-watch"><span class="gi">🍿</span><b>Regarder ensemble</b><span class="small muted">Film ou série, lancés en même temps</span></button></div></section>

 ${nav('')}</div>`},

 <p class="muted">1 minute pour aider à construire PULSE. Ton avis part dans un message que tu envoies toi-même.</p>

</div>`,

duo:()=>{const D=UI.duo||{st:'pick'};const k=cat(D.cat||S.interests[0]||'musique');
 if(D.st==='pick') return `<div class="scr">${topBar('Mode Duo')}
  <div class="hero" style="min-height:0"><div class="planet" style="width:110px;height:110px"></div><span class="tag" style="align-self:flex-start">Bêta</span><h2 style="font-size:22px">3 minutes, deux voix, une passion</h2><p class="muted small" style="max-width:30ch">Tu parles avec quelqu’un qui aime la même chose que toi. À la fin, vous choisissez tous les deux de rester en contact, ou non.</p></div>
  <h2>Choisis une passion</h2><div class="row wrap">${S.interests.map(i=>`<button class="chip ${(D.cat||S.interests[0])===i?'on':''}" data-a="duo-cat" data-v="${i}">${esc(cat(i).name)}</button>`).join('')}</div>

 if(D.st==='search') return `<div class="scr">${topBar('Mode Duo')}<div class="stack" style="align-items:center;text-align:center;padding-top:40px;gap:16px"><div class="mic hot" style="width:110px;height:110px">${ic('duo')}</div><h2>On cherche quelqu’un qui aime ${esc(k.name.toLowerCase())}…</h2><p class="muted small">Quelques secondes</p></div>${nav('')}</div>`;

 if(D.st==='call') return `<div class="scr">${topBar('Mode Duo')}
  <div class="duo-face"><div class="seat"><div class="av speaking">${avatar(S.av,96)}</div><span>Toi</span></div>${ic('duo')}<div class="seat"><div class="av">${avatar(p.av,96)}</div><span>${esc(p.name)}, ${p.age}</span></div></div>
  <div class="timer" id="duo-t">3:00</div>
  <div class="card stack" style="gap:6px"><span class="eyebrow">Pour lancer la conversation</span><b>${esc(QDAY[(dayIdx()+1)%QDAY.length])}</b><span class="small muted">Point commun : ${esc(k.name)}</span></div>

  <div class="row"><button class="btn btn-g" style="flex:1" data-a="report" data-v="${D.who}">${ic('flag')} Signaler</button><button class="btn btn-p" style="flex:1" data-a="duo-end">Terminer</button></div>${nav('')}</div>`;

},

 const ps=Object.keys(PEOPLE).filter(k=>!S.blocked.includes(k)&&PEOPLE[k].langs.includes(learn)&&S.me.langs.includes(PEOPLE[k].learn));
 return `<div class="scr">${topBar('Échange de langues')}

   ${ACTS.filter(a=>a.status==='soon').slice(0,2).map(actCard).join('')}</section>
  <section class="stack"><h2>${t('people')}</h2><p class="small muted">Selon vos passions communes. PULSE n’est pas une appli de rencontres amoureuses : on se rencontre par ce qu’on aime.</p>${Object.keys(PEOPLE).filter(p=>!S.blocked.includes(p)).sort((a,b)=>PEOPLE[b].int.filter(i=>S.interests.includes(i)).length-PEOPLE[a].int.filter(i=>S.interests.includes(i)).length).slice(0,5).map(personRow).join('')}</section></div>`;

function personRow(pid){const p=PEOPLE[pid];if(!p)return '';const f=S.friends.includes(pid),rq=S.requested.includes(pid);const common=p.int.filter(i=>S.interests.includes(i));
 return `<div class="list-item">${avatar(p.av,50)}<div class="grow"><div style="font-weight:800">${esc(p.name)}, ${p.age} <span class="tag">${p.country}</span></div><div class="small muted ellip">${p.city} · ${p.langs.join(', ')}${common.length?' · '+common.map(i=>cat(i).name).join(', '):''}</div></div>

function roomMic(r){
 const inR=R&&R.id===r.id;
 let mic,state,hand='';
 if(!inR){mic=`<button class="mic off" data-a="enter" data-v="${r.id}" aria-label="Rejoindre le salon">${ic('headphones')}</button>`;state=`<span class="muted">Touche pour rejoindre et écouter</span>`}
 else if(R.role==='listener'){mic=`<button class="mic off" data-a="room-mic" aria-label="${t('raise')}">${ic('micoff')}</button>`;state=R.hand?'<span style="color:var(--warn)">Main levée : en attente de l’hôte</span>':`<span class="muted">${t('listening')} · lève la main pour parler</span>`;}
 else{mic=`<button class="mic ${R.muted?'off':'hot'}" data-a="room-mic" aria-label="${R.muted?'Activer le micro':'Couper le micro'}" aria-pressed="${!R.muted}">${ic(R.muted?'micoff':'mic')}</button>`;state=`<span style="color:${R.muted?'var(--text2)':'var(--accent)'}">${R.muted?t('micOff'):t('micOn')}</span> <span class="small muted">· ${CAP.dict?(UI.listening?'tes paroles deviennent des sous-titres':'sous-titres de ta voix prêts'):'simulation'}</span>`}
 const handB=inR&&R.role==='listener'?`<button class="rb ${R.hand?'on':''}" data-a="room-hand" aria-label="${t('raise')}">${ic('hand')}</button>`:`<button class="rb" data-a="invite" data-v="${r.id}" aria-label="Inviter">${ic('userplus')}</button>`;
 return `<div class="mic-state">${state}</div><div class="ctr">
  <button class="rb" data-a="room-chat" data-v="${r.id}" aria-label="Chat du salon">${ic('chat')}</button>
  <button class="rb" data-a="react-sheet" aria-label="Réactions">${ic('smile')}</button>
  ${mic}${handB}
  ${inR?`<button class="rb" data-a="leave" aria-label="${t('leave')}" style="color:var(--live)">${ic('logout')}</button>`:`<button class="rb" data-a="room-menu" data-v="${r.id}" aria-label="Plus">${ic('dots')}</button>`}</div>`;
}

 'ig-clue':()=>{const g=UI.ig,x=(document.getElementById('ig-clue').value||'').trim();

  g.clues=[x,...[1,2,3].map(i=>{const L=CLUES[g.words[i]];return L[(i+Math.floor(Math.random()*3))%L.length]})];g.phase='vote';render()},
 'ig-vote':v=>{const g=UI.ig;const votes=[+v];for(let i=1;i<4;i++){const others=[0,1,2,3].filter(j=>j!==i);let t;if(i!==g.intr&&Math.random()<.55)t=g.intr;else t=others[Math.floor(Math.random()*others.length)];if(t===i)t=others[0];votes.push(t)}
  const cnt={};votes.forEach(t=>cnt[t]=(cnt[t]||0)+1);const max=Math.max(...Object.values(cnt));const top=Object.keys(cnt).filter(k=>cnt[k]===max);
  g.votes=votes;g.out=top.length===1?+top[0]:null;g.phase='result';render()},

 if(CALL&&CALL.st==='on'){const ct=document.getElementById('call-t');if(ct)ct.textContent=callTime();const cb=document.getElementById('cb-t');if(cb)cb.textContent=callTime();if(window.__tick%7===0){CALL.li++;const cc=document.getElementById('call-cc');if(cc)cc.innerHTML=`<b style="color:var(--electric)">${esc(PEOPLE[CALL.who].name)}</b> ${esc(CALLLINES[CALL.li%CALLLINES.length])}`}}
 if(V.name==='quiz'&&UI.qz&&UI.qz.phase==='q'){const l=Math.max(0,Math.ceil((UI.qz.end-Date.now())/1000));const t=document.getElementById('qz-t');if(t)t.textContent=l+' s';const b=document.getElementById('qz-bar');if(b)b.style.width=(l/12*100)+'%';if(!l)qzReveal()}
 if(V.name==='bac'&&UI.bac&&UI.bac.phase==='play'){const l=Math.max(0,Math.ceil((UI.bac.end-Date.now())/1000));const t=document.getElementById('bac-t');if(t)t.textContent=l+' s';if(!l)bacEnd()}
 if(V.name==='room'){const r=room(V.p);if(r&&r.live){const cc=document.getElementById('cc');if(UI.cc&&cc&&window.__tick%3===0&&!(UI.listening)){UI.ccI=(UI.ccI||0)+1;cc.innerHTML=ccLine(cc.dataset.com)}if(S.sim&&!UI.cc&&window.__tick%4===0)simEvent(r)}}},1000);

(function(){const c=document.getElementById('stars'),x=c.getContext('2d');function draw(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.scale(d,d);let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<Math.round(innerWidth*innerHeight/2600);i++){x.globalAlpha=.25+rnd()*.6;x.fillStyle=rnd()>.85?'#E9D5FF':'#fff';x.beginPath();x.arc(rnd()*innerWidth,rnd()*innerHeight,rnd()*1.2+.2,0,7);x.fill()}}draw();addEventListener('resize',draw)})();

render(true);
})();
